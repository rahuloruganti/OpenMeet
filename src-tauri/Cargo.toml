[package]
name = "openmeet"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Local-first meeting notes — foundation preview"

[lib]
name = "openmeet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
tempfile = "3"
cpal = "=0.18.2"
ringbuf = "0.5.2"
hound = "3.5"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls", "multipart"] }
keyring = "4"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
bzip2 = "0.6"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
wasapi = "0.26"
