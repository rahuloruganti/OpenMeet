[project]
name = "openmeet"
version = "0.9.1"
description = "OpenMeet: local-first meeting notetaker (FastAPI backend, pywebview window, React UI)."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.161.1",
  "uvicorn==0.54.0",
  "pywebview==6.2.1",
  "httpx==0.28.1",
  "keyring==25.7.0",
  "jaraco.classes==3.4.0",
  "jaraco.context==6.1.2",
  "jaraco.functools==4.6.0",
  "more-itertools==11.2.1",
  "pywin32-ctypes==0.2.3; sys_platform == 'win32'",
  "PyAudioWPatch==0.2.12.9; sys_platform == 'win32'",
  "sounddevice==0.5.6; sys_platform == 'darwin'",
  "catap==0.6.0; sys_platform == 'darwin'",
  "pywhispercpp==1.5.1",
  "numpy==2.5.4",
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-core==1.13.8",
  "websockets==15.0.1",
  "icalendar==6.3.2",
  "python-dateutil==2.9.0.post0",
  "tzdata==2026.5",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pyinstaller==6.22.3",
]

[tool.uv]
package = false
# Windows x64 and Apple Silicon are the two supported targets; the lock resolves only those.
environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "hardware: opens real audio devices. Runs only with -m hardware AND OPENMEET_PY_HARDWARE_AUDIO=1.",
  "real_model: loads a real whisper.cpp model. Runs only with OPENMEET_PY_REAL_MODEL=1 and OPENMEET_PY_MODEL_FILE (never downloads).",
]
addopts = '-q -m "not hardware and not real_model"'
