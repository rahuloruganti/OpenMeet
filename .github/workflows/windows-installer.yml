# Windows installer (manual)
#
# How to run: GitHub -> Actions -> "Windows installer" -> "Run workflow".
# It builds the NSIS installer (OpenMeet-*-setup.exe) on a Windows runner and
# uploads it as the workflow artifact "OpenMeet-windows-installer" (kept 14 days).
#
# The installer is UNSIGNED: Windows SmartScreen will warn before it runs.
# The artifact is visible only to people with access to this repository.
#
# This workflow never runs on push or pull_request, and it does not sign,
# publish, or create releases.

name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --ci -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMeet-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
